name: calorietrack

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-calorietrack}
      POSTGRES_USER: ${POSTGRES_USER:-calorietrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-calorietrack_local}
      TZ: America/Argentina/Cordoba
      PGTZ: America/Argentina/Cordoba
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      CALORIETRACK_ADDR: :8080
      CALORIETRACK_DATABASE_URL: postgres://${POSTGRES_USER:-calorietrack}:${POSTGRES_PASSWORD:-calorietrack_local}@db:5432/${POSTGRES_DB:-calorietrack}?sslmode=disable
      CALORIETRACK_ALLOWED_ORIGIN: http://localhost:${FRONTEND_PORT:-5173}
      TZ: America/Argentina/Cordoba
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

volumes:
  postgres_data:
    name: calorietrack_postgres_data

